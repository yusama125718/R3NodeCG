<!DOCTYPE html>
<html lang="jp">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="./Name.css">
	</head>
	<body>
		<div id="root">
			<h2 id="rednow">Now:</h2>
			<p id="color_red">Red</p>
			<select name="red" id="red" class="playerselect"></select>
			<h2 id="bluenow">Now:</h2>
			<p id="color_blue">Blue</p>
			<select name="blue" id="blue" class="playerselect"></select>
			<input type="button" value="Update" onclick="UpdateTeam()"></input>


		</div>
		
	</body>
	<script>
		const players = nodecg.bundleConfig.players
		for (const i in players) {
			const red = document.getElementById("red");
			const blue = document.getElementById("blue");
			const roption = document.createElement("option");
			roption.text = players[i];
			roption.value = players[i];
			red.add(roption);
			const boption = document.createElement("option");
			boption.text = players[i];
			boption.value = players[i];
			blue.add(boption);
		}

		function UpdateTeam(){
			const red = document.getElementById("red");
			const rednum = red.selectedIndex;
			const redname = red.options[rednum].value;
			const blue = document.getElementById("blue");
			const bluenum = blue.selectedIndex;
			const bluename = blue.options[bluenum].value;

			const RedRep = nodecg.Replicant('redplayer');
			const BlueRep = nodecg.Replicant('blueplayer');
			if (nodecg.Replicant("reverse").value){
				RedRep.value = bluename;
				BlueRep.value = redname;
			}
			else {
				RedRep.value = redname;
				BlueRep.value = bluename;
			}
			
			const source = nodecg.Replicant('player_source')
			source.value = "nodecg"

			alert("更新しました")
		}

		nodecg.Replicant('redplayer').on('change', (newVal) => {
			let id = "rednow"
			if (nodecg.Replicant("reverse").value)[
				id = "bluenow"
			]
			document.getElementById(id).innerText = "Now:" + newVal
		})

		nodecg.Replicant('blueplayer').on('change', (newVal) => {
			let id = "bluenow"
			if (nodecg.Replicant("reverse").value)[
				id = "rednow"
			]
			document.getElementById().innerText = "Now:" + newVal
		})

		nodecg.Replicant('reverse').on('change', (newVal) => {
			if (newVal){
				document.getElementById("color_red").innerText = "Blue"
				document.getElementById("color_blue").innerText = "Red"
			}
			else {
				document.getElementById("color_blue").innerText = "Blue"
				document.getElementById("color_red").innerText = "Red"
			}
		})
	</script>
</html>
