<!DOCTYPE html>
<html lang="jp">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="./Score.css">
	</head>
	<body>
		<div id="root">
            <div style="text-align: center;">
                <h2 id="match-round"></h2>
            </div>
            <div class="bord">
                <div class="bluescore score-board">
                    <h2 id="bluename"></h2>
                    <p>Blue</p>
                    <p id="bluescore" class="score">0</p>
                    <input type="button" value="+" onclick="BlueUp()" class="button"></input>
                    <input type="button" value="-" onclick="BlueDown()" class="button"></input>
                    <input type="button" value="Reset" onclick="BlueReset()" class="button"></input>
                </div>
                <div class="span">
                    <span class="box"></span>
                </div>
                <div class="redscore score-board">
                    <h2 id="redname"></h2>
                    <p>Red</p>
                    <p id="redscore" class="score">0</p>
                    <input type="button" value="+" onclick="RedUp()" class="button"></input>
                    <input type="button" value="-" onclick="RedDown()" class="button"></input>
                    <input type="button" value="Reset" onclick="RedReset()" class="button"></input>
                </div>
            </div>
            
		</div>
        <div class="bottom">
            <div class="bottom-btn">
                <input type="button" value="サイドチェンジ" onclick="SideChange()" class="button"></input>
            </div>
            <div class="bottom-btn">
                <input type="button" value="結果を送信する" onclick="ReportResult()" class="button" id="submit-btn"></input>
            </div>
        </div>
    </body>
	<script>
        let red = 0
        let blue = 0
        let current_match
        const round_mst = nodecg.bundleConfig.round_name

        function UpdateScore(){
            const score = {
                red : red,
                blue : blue
            }

            const Rep = nodecg.Replicant('score')
            Rep.value = score
        }

        function RedUp(){
            if (nodecg.Replicant('reverse').value) blue++
            else red++
            UpdateScore()
        }

        function RedDown(){
            red--
            UpdateScore()
        }

        function RedReset(){
            red = 0
            UpdateScore()
        }

        function BlueUp(){
            blue++
            UpdateScore()
        }

        function BlueDown(){
            blue--
            UpdateScore()
        }

        function BlueReset(){
            blue = 0
            UpdateScore()
        }

        function SideChange(){
            nodecg.Replicant('reverse').value = !nodecg.Replicant('reverse').value
        }

        nodecg.Replicant('score').on('change', (newVal) => {
            red = newVal.red
            blue = newVal.blue

            update_score(nodecg.Replicant('reverse').value)
        })

        nodecg.Replicant('redplayer').on('change', (newVal) => {
			update_name(nodecg.Replicant('reverse').value)
		})

		nodecg.Replicant('blueplayer').on('change', (newVal) => {
			update_name(nodecg.Replicant('reverse').value)
		})

        nodecg.Replicant('player_source').on('change', (newVal) => {
			document.getElementById("submit-btn").disabled = newVal != "challonge"
		})

        nodecg.Replicant('current_match').on('change', (newVal) => {
			current_match = newVal
            get_round_name(current_match["round"])
		})

        nodecg.Replicant('reverse').on('change', (newVal) => {
			update_name(newVal)
            update_score(newVal)
		})

        function update_name(reverse){
            if (reverse){
                document.getElementById("redname").innerText = nodecg.Replicant('blueplayer').value
                document.getElementById("bluename").innerText = nodecg.Replicant('redplayer').value
            }
            else {
                document.getElementById("redname").innerText = nodecg.Replicant('redplayer').value
                document.getElementById("bluename").innerText = nodecg.Replicant('blueplayer').value
            }
        }

        function update_score(reverse){
            if (reverse){
                document.getElementById("redscore").innerText = blue
                document.getElementById("bluescore").innerText = red
            }
            else {
                document.getElementById("redscore").innerText = red
                document.getElementById("bluescore").innerText = blue
            }
        }

        // ラウンド名をマスタから取得
        function get_round_name(number){
            const key = "round_" + number.toString()
            if (key in round_mst){
                return round_mst[key]
            }
            const prefix = number > 0 ? "" : "Lower"
            return prefix + Math.abs(number).toString() + "回戦"
        }

        function ReportResult(){
            if (red == blue){
                window.alert("同点の記録はできません")
                return
            }
            if (current_match["state"] == "complete" && !window.confirm("結果がすでに入力されています。上書きしてよろしいですか？")) return

            const winner = red > blue ? nodecg.Replicant('redplayer').value : nodecg.Replicant('blueplayer').value
            if (window.confirm(winner + "の勝利で送信します。よろしいですか？")){
                fetch("/api/challonge/record", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        winner: winner,
                        red_score: red,
                        blue_score: blue,
                        match: current_match
                    })
                })
                .then(response => response.json())
                .then(result => {
                    if (result["status"] == "success"){
                        window.alert("送信しました")
                        return
                    }
                    else {
                        window.alert("送信に失敗しました")
                        return
                    }
                })
            }
        }
	</script>
</html>
