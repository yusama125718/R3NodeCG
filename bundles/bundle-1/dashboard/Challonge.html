<!DOCTYPE html>
<html lang="jp">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="./Challonge.css">
	</head>
	<body>
        <div id="root">
            <button onclick="init_list()">更新</button>
            <br>

            <div class="match-frame">
                <ul class="match-list" id="match-list">
                </ul>
            </div>
        </div>
        
    </body>
	<script>
        init_list()

        async function init_list(){
            const ul = document.getElementById("match-list")
            ul.innerHTML = ""
            await fetch("/api/challonge/matches")
            .then(response => response.json())
            .then(result => {
                for(let i = 1; i < result["match_count"]; i++){
                    const match_data = result["datas"]["match_" + i]

                    const li = document.createElement('li')
                    li.classList.add(match_data["state"])
                    const button = document.createElement("button")
                    button.classList.add("match-btn")
                    button.type = "button"
                    button.addEventListener('click', function(){
                        const matchRep = nodecg.Replicant('current_match')
                        matchRep.value = match_data
                        const redRep = nodecg.Replicant('redplayer')
                        redRep.value = match_data["red"]["team_name"]
                        const blueRep = nodecg.Replicant('blueplayer')
                        blueRep.value = match_data["blue"]["team_name"]
                        const source = nodecg.Replicant('player_source')
                        source.value = "challonge"
                        window.alert("試合を変更しました")
                    })
                    const prefix = match_data["round"] > 0 ? "" : "Lower"
                    const p1 = document.createElement("p")
                    p1.innerText = prefix + Math.abs(match_data["round"]).toString() + "回戦"
                    const p2 = document.createElement("p")
                    p2.innerText = match_data["red"]["team_name"] + " vs " + match_data["blue"]["team_name"]

                    button.appendChild(p1)
                    button.appendChild(p2)
                    li.appendChild(button)
                    ul.appendChild(li)
                }
            })
        }
	</script>
</html>
