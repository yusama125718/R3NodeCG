<!DOCTYPE html>
<html lang="jp">
	<head>
		<meta charset="UTF-8" />
    <link rel="stylesheet" href="./index.css">
		<link rel="stylesheet" href="./waiting.css">
	</head>
	<body>
		<div class="waiting-root">
      <div class="clock">
        <p id="clock"></p>
      </div>
      <div class="tournament">
        <div class="tournament-header">
          <p>トーナメント</p>
        </div>
        <div class="challonge-view">
          <iframe id="challonge" src="" width="100%" height="100%" frameborder="0" scrolling="auto" allowtransparency="true"></iframe>
        </div>
      </div>
      
      <div class="waiting-footer">
        <div class="waiting-footer-body">
          <p id="message">しばらくお待ちください...</p>
        </div>
      </div>
      <div class="logo">
        <img src="./assets/pkb_icon.webp">
      </div>
    </div>
	</body>
  <script>
    document.getElementById("challonge").src = "http://challonge.com/" + nodecg.bundleConfig.challonge_id + "/module"
    setInterval(UpdateTime, 1000)

    function UpdateTime(){
      const nowTime = new Date()
      document.getElementById("clock").innerText = nowTime.getHours().toString().padStart(2, '0') + ":" + nowTime.getMinutes().toString().padStart(2, '0')
    }

    nodecg.Replicant('waiting_message').on('change', (newVal) => {
			document.getElementById("message").innerText = newVal.toString()
		})
  </script>
</html>
