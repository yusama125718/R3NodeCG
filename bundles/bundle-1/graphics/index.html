<!DOCTYPE html>
<html lang="jp">
	<head>
		<meta charset="UTF-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@100..700&family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="./index.css">
		<script type="module" src="./index.js"></script>
	</head>
	<body>
		<div class="upperbanner">
			<div class="red">
				<div class="redteam">
					<p id="redteam" class="redname"></p>
					<div class="redrounddiv">
						<div id="redround" class="redround">
						</div>
					</div>
				</div>
				<div class="redscore">
					<p id="redscore" class="num">0</p>
				</div>
			</div>
			<div class="round-name">
				<p id="round-name" class="round-name-txt"></p>
			</div>
			<div class="blue">
				<div class="bluescore">
					<p id="bluescore" class="num">0</p>
				</div>
				<div class="blueteam">
					<p id="blueteam" class="bluename"></p>
					<div class="bluerounddiv">
						<div id="blueround" class="blueround">
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="logo">
			<img src="./assets/pkb_icon.webp" class="logo-img">
		</div>
	</body>
</html>
